services:
  postgres-db:
    image: postgres:17
    container_name: product-service-db
    environment:
      POSTGRES_DB: product_service
      POSTGRES_USER: product_service
      POSTGRES_PASSWORD: product_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build:
      context: ./product-service
    container_name: product-service-app
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/product_service
      SPRING_DATASOURCE_USERNAME: product_service
      SPRING_DATASOURCE_PASSWORD: product_service
    ports:
      - "8080:8080"

volumes:
  postgres-data:
