spring.application.name=product-service
spring.datasource.url=jdbc:postgresql://localhost:5432/product_service
spring.datasource.username=product_service
spring.datasource.password=product_service
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Product microservice
product.archive.retention-period=P2Y
product.archive.cleanup-cron=0 0 3 * * *
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
