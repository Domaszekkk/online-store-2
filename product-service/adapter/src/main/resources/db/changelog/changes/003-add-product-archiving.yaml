databaseChangeLog:
  - changeSet:
      id: 010-add-archived-at-to-products
      author: estore
      comment: "Products withdrawn from sale are archived instead of deleted; null means the product is on sale"
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: archived_at
                  type: TIMESTAMP WITH TIME ZONE
      rollback:
        - dropColumn:
            tableName: products
            columnName: archived_at
