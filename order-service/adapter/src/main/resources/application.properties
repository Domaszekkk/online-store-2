spring.application.name=order-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5434/order_service
spring.datasource.username=order_service
spring.datasource.password=order_service
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Order placement and history microservice
cart.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.cart-service.connect-timeout=2000
spring.cloud.openfeign.client.config.cart-service.read-timeout=3000
cart.service.retry.period-millis=100
cart.service.retry.max-period-millis=1000
cart.service.retry.max-attempts=3
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
order.events.topic=order-placed
order.events.partitions=3
outbox.publisher.fixed-delay-millis=1000
outbox.publisher.batch-size=100
outbox.publisher.send-timeout-millis=5000
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false
document.events.topic=document-issued
document.events.dead-letter-topic=document-issued-dlt
document.events.retry.interval-millis=1000
document.events.retry.max-attempts=3
outbox.cleanup.retention-period=P7D
outbox.cleanup.cron=0 30 3 * * *
