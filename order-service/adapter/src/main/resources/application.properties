spring.application.name=order-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5434/order_service
spring.datasource.username=order_service
spring.datasource.password=order_service
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Order placement and history microservice
cart.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.cart-service.connect-timeout=2000
spring.cloud.openfeign.client.config.cart-service.read-timeout=3000
cart.service.retry.period-millis=100
cart.service.retry.max-period-millis=1000
cart.service.retry.max-attempts=3
