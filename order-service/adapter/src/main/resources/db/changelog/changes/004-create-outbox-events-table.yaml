databaseChangeLog:
  - changeSet:
      id: 006-create-outbox-events-table
      author: estore
      comment: "Transactional outbox: events are saved in the same transaction as the order and published to Kafka later"
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false
              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_unpublished
            columns:
              - column:
                  name: created_at
            where: published_at IS NULL
      rollback:
        - dropTable:
            tableName: outbox_events
