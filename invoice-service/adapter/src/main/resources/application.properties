spring.application.name=invoice-service
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5435/invoice_service
spring.datasource.username=invoice_service
spring.datasource.password=invoice_service
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
info.app.name=${spring.application.name}
info.app.description=Invoices and purchase confirmations issued from order events
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=invoice-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.concurrency=3
order.events.topic=order-placed
order.events.dead-letter-topic=order-placed-dlt
order.events.retry.interval-millis=1000
order.events.retry.max-attempts=3
invoice.seller.name=E-Store Sp. z o.o.
invoice.seller.tax-identification-number=1234563218
invoice.seller.street=ul. Prosta 20
invoice.seller.city=Warszawa
invoice.seller.postal-code=00-850
invoice.seller.country=Polska
invoice.seller.bank-account-number=PL61 1090 1014 0000 0712 1981 2874
logging.level.org.apache.pdfbox.pdmodel.font.PDType1Font=ERROR
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
document.events.topic=document-issued
document.events.partitions=3
outbox.publisher.fixed-delay-millis=1000
outbox.publisher.batch-size=100
outbox.publisher.send-timeout-millis=5000
outbox.cleanup.retention-period=P7D
outbox.cleanup.cron=0 30 3 * * *
