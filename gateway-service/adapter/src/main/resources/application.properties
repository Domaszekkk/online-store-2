spring.application.name=gateway-service
server.port=8084
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Backend for frontend: the single entry point of the shop frontend
product.service.url=http://localhost:8080
cart.service.url=http://localhost:8081
order.service.url=http://localhost:8082
invoice.service.url=http://localhost:8083
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.order-service.read-timeout=10000
gateway.client.retry.period-millis=100
gateway.client.retry.max-period-millis=1000
gateway.client.retry.max-attempts=3
gateway.cors.allowed-origins=http://localhost:5173
gateway.document.retry-after-seconds=2
