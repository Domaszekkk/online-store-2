spring.application.name=cart-service
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5433/cart_service
spring.datasource.username=cart_service
spring.datasource.password=cart_service
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
info.app.name=${spring.application.name}
info.app.description=Shopping cart microservice
product.service.url=http://localhost:8080
spring.cloud.openfeign.client.config.product-service.connect-timeout=1000
spring.cloud.openfeign.client.config.product-service.read-timeout=2000
product.service.retry.period-millis=100
product.service.retry.max-period-millis=1000
product.service.retry.max-attempts=2
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
cart.expiration.inactivity-timeout=PT30M
cart.expiration.check-interval-millis=60000
cart.expiration.retention-period=P7D
cart.expiration.cleanup-cron=0 0 4 * * *
