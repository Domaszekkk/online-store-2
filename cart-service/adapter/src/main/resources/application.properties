spring.application.name=cart-service
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5433/cart_service
spring.datasource.username=cart_service
spring.datasource.password=cart_service
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Shopping cart microservice
product.service.url=http://localhost:8080
spring.cloud.openfeign.client.config.product-service.connect-timeout=2000
spring.cloud.openfeign.client.config.product-service.read-timeout=3000
product.service.retry.period-millis=100
product.service.retry.max-period-millis=1000
product.service.retry.max-attempts=3
