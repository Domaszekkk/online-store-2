databaseChangeLog:
  - changeSet:
      id: 002-create-cart-items-table
      author: estore
      comment: "Creates the cart_items table"
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_items
                    nullable: false
              - column:
                  name: cart_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_cart_items_cart
                    references: carts(id)
              - column:
                  name: product_id
                  type: UUID
              - column:
                  name: variant_id
                  type: UUID
              - column:
                  name: product_name
                  type: VARCHAR(255)
              - column:
                  name: stock_keeping_unit
                  type: VARCHAR(255)
              - column:
                  name: unit_price_amount
                  type: numeric(19, 2)
              - column:
                  name: unit_price_currency
                  type: VARCHAR(3)
              - column:
                  name: quantity
                  type: INT
              - column:
                  name: line_total_amount
                  type: numeric(19, 2)
              - column:
                  name: line_total_currency
                  type: VARCHAR(3)
      rollback:
        - dropTable:
            tableName: cart_items

  - changeSet:
      id: 003-create-cart-item-addons-table
      author: estore
      comment: "Creates the cart_item_addons table"
      changes:
        - createTable:
            tableName: cart_item_addons
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_item_addons
                    nullable: false
              - column:
                  name: cart_item_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_cart_item_addons_item
                    references: cart_items(id)
              - column:
                  name: product_ref_id
                  type: UUID
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: price_amount
                  type: numeric(19, 2)
              - column:
                  name: price_currency
                  type: VARCHAR(3)
      rollback:
        - dropTable:
            tableName: cart_item_addons
