databaseChangeLog:
  - changeSet:
      id: 006-add-cart-indexes
      author: estore
      comment: "Indexes for loading cart items and their add-ons by foreign key"
      changes:
        - createIndex:
            tableName: cart_items
            indexName: idx_cart_items_cart_id
            columns:
              - column:
                  name: cart_id
        - createIndex:
            tableName: cart_item_addons
            indexName: idx_cart_item_addons_cart_item_id
            columns:
              - column:
                  name: cart_item_id
