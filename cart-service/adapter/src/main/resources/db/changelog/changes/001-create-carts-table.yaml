databaseChangeLog:
  - changeSet:
      id: 001-create-carts-table
      author: estore
      comment: "Creates the carts table"
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_carts
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: total_amount
                  type: numeric(19, 2)
              - column:
                  name: total_currency
                  type: VARCHAR(3)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
      rollback:
        - dropTable:
            tableName: carts
